[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-diagnostico-vehicular"
version = "1.0.0"
description = "Chatbot utilizando machine learning para el diagnóstico vehicular en talleres mecánicos de Carabayllo"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Juan Joel Leon Chumbe" },
    { name = "Luisa Leonor Poma Cataño" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0",
    "joblib>=1.2.0",
    "scipy>=1.10.0",
    "requests>=2.30.0",
    "faiss-cpu>=1.7.4",
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
    "slowapi>=0.1.8",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "twilio>=8.0.0",
    "SpeechRecognition>=3.10.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "pydub>=0.25.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.3.0",
    "flake8>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
